[project]
name = "hr-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Luca Grillo",email = "lucagrillo307@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb (>=1.5.9,<2.0.0)",
    "openai (>=3.20.0,<4.0.0)",
    "chainlit (>=2.12.0,<3.0.0)",
    "ollama (>=0.6.3,<0.7.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "langchain-openai (>=1.6.7,<2.0.0)",
    "torch (>=2.14.1,<3.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "markitdown[docx,pdf,pptx,xlsx] (>=0.1.8,<0.2.0)"
]

[tool.poetry]
packages = [{include = "hr_assistant", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
